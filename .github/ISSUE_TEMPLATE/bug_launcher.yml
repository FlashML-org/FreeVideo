name: Installation or launcher / 安装或启动器
description: Help with installation, updates or startup / 安装、更新或启动问题
body:
  - type: markdown
    attributes:
      value: |
        If the launcher shows "No NVIDIA graphics card was found" or "This graphics card is not supported", this computer cannot run FreeVideo, and a report cannot change this. FreeVideo requires an NVIDIA RTX 30 series or newer graphics card, or a Mac with Apple silicon.

        如果启动器显示“未找到 NVIDIA 显卡”或“这张显卡不受支持”，说明这台电脑无法运行 FreeVideo，提交问题也无法改变这一点。FreeVideo 需要 NVIDIA RTX 30 系列或更新的显卡，或 Apple 芯片的 Mac。
  - type: input
    id: version
    attributes:
      label: FreeVideo version / FreeVideo 版本
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 遇到了什么问题？
      description: Describe what you did and what happened. / 简单说明操作和出现的问题。
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Error or local report (optional) / 错误详情或本地报告（选填）
      description: Paste the error or drag a local diagnostic report here. / 粘贴错误详情，或拖入本地诊断报告。
