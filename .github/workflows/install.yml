name: Installation and Windows launcher
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      defender_baseline:
        description: 'Also diagnose the currently published package before rebuilding'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: freevideo-public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check every ComfyUI browser module
        run: |
          for file in web/*.js; do node --input-type=module --check < "$file"; done
          node scripts/test_freevideo_entry.mjs
          node scripts/test_prompt_guide.mjs
      - name: Check CLI, ComfyUI entry and packaged resources
        run: |
          python scripts/check_installation.py
          bash -n setup.sh test.sh freevideo scripts/bootstrap_linux.sh
          ./setup.sh --help
          ./test.sh --help
          ./freevideo --help
      - name: Build installable Python packages
        run: |
          python -m pip install build
          python -m build
  windows:
    needs: [installation]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: windows-launcher-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints/windows-launcher.txt
      - run: python scripts/check_installation.py
      - run: python -m pip install -r constraints/windows-launcher.txt
      - name: Diagnose previous release with real-time Defender
        if: github.event_name == 'workflow_dispatch' && inputs.defender_baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download windows-preview --repo FlashML-org/FreeVideo --pattern FreeVideo.exe --pattern FreeVideo-Windows-folder.zip --dir build/previous-release
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the previous release for comparison' }
          python scripts/scan_windows_release.py --file build/previous-release/FreeVideo.exe --file build/previous-release/FreeVideo-Windows-folder.zip --verify-launches build/previous-release/FreeVideo.exe build/previous-release/FreeVideo-Windows-folder.zip --report antivirus/previous-release.json
          $baselineExit = $LASTEXITCODE
          if (Test-Path antivirus/previous-release.json) { Get-Content antivirus/previous-release.json -Raw }
          Write-Output "Previous-release diagnosis exit code: $baselineExit"
          # The old package is evidence, not the replacement candidate. The
          # new final bytes must pass the mandatory protection gate below.
          exit 0
      - name: Build Windows launcher
        run: |
          python scripts/build_windows.py --onefolder --out build/windows-folder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_windows.py --out build/windows-exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/windows-folder/dist/FreeVideo-Windows-folder.zip build/windows-exe/dist/
      - name: Sign Windows launchers when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          ./scripts/sign_windows_release.ps1 `
            -OneFile build/windows-exe/dist/FreeVideo.exe `
            -FolderZip build/windows-exe/dist/FreeVideo-Windows-folder.zip `
            -FolderExecutable build/windows-folder/dist/FreeVideo/FreeVideo.exe
      - name: Hash final Windows launchers
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import hashlib; p=Path('build/windows-exe/dist'); (p/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in (p/'FreeVideo.exe', p/'FreeVideo-Windows-folder.zip')))"
      # Keep the full report in the job log; a blocked or inconclusive scan
      # must stop publication instead of making a suspicious build public.
      - name: Open both packaged launchers and scan with real-time Defender
        timeout-minutes: 20
        shell: pwsh
        run: |
          python scripts/scan_windows_release.py --file build/windows-exe/dist/FreeVideo.exe --file build/windows-folder/dist/FreeVideo/FreeVideo.exe --file build/windows-exe/dist/FreeVideo-Windows-folder.zip --verify-launches build/windows-exe/dist/FreeVideo.exe build/windows-exe/dist/FreeVideo-Windows-folder.zip --report antivirus/report.json
          $scanExit = $LASTEXITCODE
          if (Test-Path antivirus/report.json) { Get-Content antivirus/report.json -Raw }
          exit $scanExit
      - name: Print retained protection and startup checks on failure
        if: failure()
        shell: pwsh
        run: |
          python -c "import json; from scripts.scan_windows_release import threat_history; print(json.dumps(threat_history(), indent=2))"
          Get-ChildItem antivirus -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName -Tail 100 }
          Get-ChildItem (Join-Path $env:USERPROFILE 'Downloads/FreeVideo-release-check-*') -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq 'smoke.json' } | ForEach-Object { Get-Content $_.FullName -Raw }
      # Release assets use Releases storage, not the Actions artifact quota.
      # This step still requires all installation/build/startup checks above.
      - name: Publish Windows launcher
        if: github.repository == 'FlashML-org/FreeVideo' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: build/windows-exe/dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Python writes CRLF on Windows; strip line endings before GNU checks.
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check -
          # BEGIN RETRY HELPERS
          gh_retry() {
            local label="$1"; shift
            local attempt code
            for attempt in 1 2 3; do
              echo "$label (attempt $attempt/3)" >&2
              if timeout 300s "$@"; then return 0; else code=$?; fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 2))"; fi
            done
            echo "::error::$label failed after 3 attempts (exit $code)" >&2
            return "$code"
          }
          gh_json() {
            local label="$1"; shift
            local attempt result
            result=$(mktemp)
            for attempt in 1 2 3; do
              echo "$label (attempt $attempt/3)" >&2
              if timeout 60s gh "$@" > "$result"; then
                if python -m json.tool "$result" > /dev/null; then
                  cat "$result"; rm -f "$result"; return 0
                fi
                echo "$label returned empty or incomplete JSON; retrying the read" >&2
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 2))"; fi
            done
            rm -f "$result"
            echo "::error::$label failed: GitHub did not return a complete JSON response" >&2
            return 1
          }
          # END RETRY HELPERS
          # A single moving preview avoids retaining old development snapshots.
          gh_json 'Read current main' api "repos/$GH_REPO/git/ref/heads/main" > main.json
          current_main=$(python -c 'import json; print(json.load(open("main.json"))["object"]["sha"])' | tr -d '\r')
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            # README editing must not discard a checked installer. Publish the
            # exact built revision only when main is its README-only descendant.
            # Runtime/workflow changes and force-push divergence still stop it.
            gh_json 'Check changes after this build' api "repos/$GH_REPO/compare/$GITHUB_SHA...$current_main" > comparison.json
            if ! python - <<'PY_CURRENT'
          import json, os, sys
          comparison = json.load(open('comparison.json'))
          files = comparison.get('files')
          allowed = {'README.md', 'README.zh-CN.md'}
          safe = (comparison.get('status') == 'ahead'
                  and comparison.get('merge_base_commit', {}).get('sha') == os.environ['GITHUB_SHA']
                  and isinstance(files, list) and len(files) <= len(allowed)
                  and all(row.get('filename') in allowed
                          and row.get('previous_filename', row.get('filename')) in allowed
                          for row in files))
          sys.exit(0 if safe else 1)
          PY_CURRENT
            then
              exit 0
            fi
          fi
          preview_tag=windows-preview
          cat > release-notes.md <<'NOTES'
          <div align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://freevideo-community.pages.dev/logo-dark.svg">
              <img alt="FreeVideo" src="https://freevideo-community.pages.dev/logo-light.svg" width="55%">
            </picture>
          </div>

          Run MiniMax H3 on your own GPU, with FreeVideo inside ComfyUI.

          Now supports community LoRAs. [See comparisons](https://github.com/FlashML-org/FreeVideo/blob/main/docs/LoRA.md).

          1. [Download FreeVideo.exe](https://github.com/FlashML-org/FreeVideo/releases/download/windows-preview/FreeVideo.exe) and run it.
          2. Select an existing ComfyUI folder or install a new one. Add existing model folders to reuse your files; missing models download automatically.
          3. Click **Install & launch** to open the FreeVideo workspace in your browser.

          **Offline installation:** Get the packages from [Quark](https://pan.quark.cn/s/c51235b84618) and drag the ZIP files into the launcher. No extraction needed. See the [installation guide](https://github.com/FlashML-org/FreeVideo#getting-started) for package choices.

          ### 中文

          FreeVideo 让 MiniMax H3 在消费级显卡上本地运行，打开 ComfyUI 即可创作。

          支持社区 LoRA。[查看效果对比](https://github.com/FlashML-org/FreeVideo/blob/main/docs/LoRA.zh-CN.md)。

          1. [下载 FreeVideo.exe](https://github.com/FlashML-org/FreeVideo/releases/download/windows-preview/FreeVideo.exe) 并运行。
          2. 选择已有的 ComfyUI 或安装新的 ComfyUI。可添加模型目录以复用文件，缺失的模型会自动下载。
          3. 点击 **安装并启动**，浏览器中会打开 FreeVideo 创作面板。

          **离线安装：** 从[夸克网盘](https://pan.quark.cn/s/c51235b84618)下载离线包，将 ZIP 直接拖入启动器，无需解压。包的选择见[安装说明](https://github.com/FlashML-org/FreeVideo/blob/main/README.zh-CN.md#开始使用)。

          [Discord](https://discord.gg/MsA277cJzZ) · [QQ Group / QQ 群](https://freevideo-community.pages.dev/qq) · [WeChat Group / 微信群](https://freevideo-community.pages.dev/wechat)
          NOTES
          # A failed read is not evidence that a tag or release is missing.
          gh_json 'Read preview tags' api "repos/$GH_REPO/git/matching-refs/tags/$preview_tag" > tags.json
          tag_exists=$(python -c 'import json; print(int(any(r["ref"] == "refs/tags/windows-preview" for r in json.load(open("tags.json")))))' | tr -d '\r')
          gh_json 'Read releases including drafts' api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > releases.json
          release_exists=$(python -c 'import json; print(int(any(r["tag_name"] == "windows-preview" for page in json.load(open("releases.json")) for r in page)))' | tr -d '\r')
          if [ "$tag_exists" = 1 ]; then
            gh_retry 'Update preview tag' gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$preview_tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh_retry 'Create preview tag' gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$preview_tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          if [ "$release_exists" = 0 ]; then
            gh_retry 'Create draft release' gh release create "$preview_tag" --verify-tag --draft --prerelease --latest=false --title 'FreeVideo for Windows' --notes-file release-notes.md
          fi
          gh_retry 'Upload launcher' gh release upload "$preview_tag" FreeVideo.exe FreeVideo-Windows-folder.zip SHA256SUMS.txt --clobber
          # Publish metadata last, bound to the immutable executable asset ID.
          # Readers reject a mismatched pair while a moving preview is updating.
          gh_json 'Locate release including drafts' release view "$preview_tag" --json databaseId > release-id.json
          release_id=$(python -c 'import json; print(json.load(open("release-id.json"))["databaseId"])' | tr -d '\r')
          gh_json 'Read uploaded asset metadata' api "repos/$GH_REPO/releases/$release_id" > release.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          build = json.loads(Path('launcher-build.json').read_text())
          release = json.loads(Path('release.json').read_text())
          asset = next(a for a in release['assets'] if a['name'] == 'FreeVideo.exe')
          binary = Path('FreeVideo.exe')
          assert asset['size'] == binary.stat().st_size
          build['asset'] = dict(id=asset['id'], bytes=binary.stat().st_size,
                                sha256=hashlib.sha256(binary.read_bytes()).hexdigest())
          Path('update.json').write_text(json.dumps(build, indent=2))
          PY
          gh_retry 'Upload update manifest' gh release upload "$preview_tag" update.json --clobber
          gh_retry 'Publish release' gh release edit "$preview_tag" --draft=false --prerelease --latest=false --title 'FreeVideo for Windows' --notes-file release-notes.md
          # Previous development snapshots have been archived privately.
          # Remove their release/source-archive references only after replacement.
          python - <<'PY_CLEANUP'
          import json
          from pathlib import Path
          releases = json.loads(Path('releases.json').read_text())
          tags = [r['tag_name'] for page in releases for r in page
                  if r['tag_name'].startswith('windows-preview-')]
          Path('previous-previews.txt').write_text(''.join(tag + '\n' for tag in tags))
          PY_CLEANUP
          while IFS= read -r previous; do
            previous=${previous%$'\r'}
            gh_retry 'Remove archived preview' gh release delete "$previous" --cleanup-tag --yes
          done < previous-previews.txt
