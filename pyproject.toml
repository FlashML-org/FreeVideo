[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freevideo-engine"
version = "2026.9.16.41444"
description = "FreeVideo video and audio generation with automatic GPU and memory optimization"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["psutil>=6", "safetensors>=0.8.0", "numpy>=2", "pillow>=11", "av>=14"]

[project.optional-dependencies]
launcher = ["PySide6-Essentials==6.11.2"]
runtime = [
  "triton==3.7.1; sys_platform == 'linux'",
  "triton-windows==3.7.1.post27; sys_platform == 'win32'",
  "transformers==5.15.0", "accelerate==1.14.0", "peft==0.20.0",
  "safetensors==0.8.0", "huggingface_hub==1.30.0", "hf-xet==1.6.1a0",
  "omegaconf==2.3.1", "pyyaml==6.0.3", "einops==0.8.2",
  "numpy==2.5.2", "pillow==12.3.0", "av==18.1.0", "tqdm",
  "importlib_metadata>=8", "requests[socks]>=2.32", "httpx[socks]>=0.28",
  "modelscope-hub==0.4.2"
]

[project.scripts]
freevideo = "freevideo_engine.cli:main"

[tool.setuptools.packages.find]
include = ["freevideo_engine*"]

[tool.setuptools.package-data]
freevideo_engine = ["build-version.txt", "build-identity.json", "release_notes.json", "dependencies.json", "model_files.json", "model_shares.json", "prepared_models.json", "macos_reference_catalog.json", "bootstrap_versions.json", "uv_downloads.json", "torch_downloads.json", "test_prompts.json", "windows_bootstrap.ps1", "assets/*.png", "assets/*.ico", "launcher/*.qml", "launcher/licenses/*.txt", "licenses/*.txt"]
